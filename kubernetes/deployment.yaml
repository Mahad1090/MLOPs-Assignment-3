apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-api
  namespace: mlops
  labels:
    app.kubernetes.io/name: prediction-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: mlops-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: prediction-api
          image: prediction-api:1.0.0
          imagePullPolicy: IfNotPresent   # image is loaded into the kind node
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: prediction-api-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
