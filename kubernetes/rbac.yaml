# Least-privilege identity for the agent: read access to workloads in the mlops
# namespace plus patch on Deployments (rollout restart / scale). No secrets, no
# delete, no exec, nothing outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops
roleRef:
  kind: Role
  name: mlops-agent
  apiGroup: rbac.authorization.k8s.io
